  <style>
    :root {
      --paper: #E9E3D6;
      --card: #F5EEDF;
      --ink: #16181D;
      --ink-muted: #625D55;
      --tomato: #C8282B;
      --on-tomato: #FFFFFF;
      --hairline: rgba(22, 24, 29, 0.16);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #081A31;
        --card: #0C2443;
        --ink: #F5EEDF;
        --ink-muted: #B9B1A3;
        --tomato: #E23036;
        --on-tomato: #FFFFFF;
        --hairline: rgba(245, 238, 223, 0.18);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
      text-align: center;
    }
    .container { width: 100%; max-width: 420px; }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: var(--tomato);
      letter-spacing: 0.01em;
      margin-bottom: 8px;
    }
    .tagline {
      color: var(--ink);
      font-size: 1.05rem;
      line-height: 1.45;
      margin-bottom: 24px;
    }
    .shared {
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 20px 18px;
      margin-bottom: 24px;
      box-shadow: 0 2px 0 var(--hairline);
      overflow-wrap: anywhere;
    }
    .shared-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.8rem;
      color: var(--ink-muted);
      margin-bottom: 10px;
    }
    .shared-quote {
      font-size: 1.2rem;
      line-height: 1.5;
      font-style: italic;
      quotes: '\201C' '\201D';
    }
    .shared-quote::before { content: open-quote; }
    .shared-quote::after { content: close-quote; }
    .shared-card {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--tomato);
      font-weight: 700;
    }
    .message {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink-muted);
      font-size: 0.95rem;
      line-height: 1.55;
      margin-bottom: 20px;
    }
    .actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .btn {
      display: inline-block;
      min-width: 240px;
      padding: 14px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 1rem;
    }
    .btn-primary { background: var(--tomato); color: var(--on-tomato); }
    .btn-secondary { color: var(--ink); border: 1px solid var(--hairline); }
    .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .ai {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin-top: 28px;
      color: var(--ink-muted);
      font-size: 0.8rem;
      line-height: 1.5;
    }
    footer {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin-top: 24px;
      color: var(--ink-muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Sezgi</h1>
    <p class="tagline" id="tagline">Tarot, coffee cup reading, dreams and your daily horoscope</p>

    <section class="shared" id="shared" hidden>
      <p class="shared-label" id="shared-label"></p>
      <blockquote class="shared-quote" id="shared-quote" hidden></blockquote>
      <p class="shared-card" id="shared-card" hidden></p>
    </section>

    <p class="message" id="message">Open this link inside the Sezgi app, or install it to continue.</p>
    <div class="actions">
      <a class="btn btn-primary" id="cta" href="https://play.google.com/store/apps/details?id=com.yinyangstudio.kismet">Get it on Google Play</a>
      <a class="btn btn-secondary" id="open" href="#" hidden>Open in Sezgi</a>
    </div>
    <p class="ai" id="ai">Readings are written by AI, for reflection and entertainment.</p>
    <footer>&copy; 2026 Yin&amp;Yang Studio</footer>
  </main>

  <!-- Bounce, localization and shared-quote logic: assets/open.js
       (checked by tools/test_open.js). -->
  <script src="/kismet-pages/assets/open.js"></script>
</body>
</html>

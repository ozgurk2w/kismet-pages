<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Tarot in Sezgi</title>
  <script>
    var appUrl = 'sezgi:///tarot' + window.location.search + window.location.hash;
    var storeUrl = 'https://play.google.com/store/apps/details?id=com.yinyangstudio.kismet';
    var fallbackTimer;

    function cancelFallback() {
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }
    }

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') {
        cancelFallback();
      }
    });
    window.addEventListener('pagehide', cancelFallback);

    fallbackTimer = setTimeout(function() { window.location = storeUrl; }, 2000);
    window.location = appUrl;
  </script>
</head>
<body style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0A0A0F;color:#E8E8F0;display:grid;min-height:100vh;place-items:center;text-align:center;padding:24px;">
  <main>
    <h1 style="font-size:2rem;font-weight:500;letter-spacing:.04em;">SEZGI</h1>
    <p style="color:#9A9CA8;">Opening Tarot in the Sezgi app...</p>
    <a href="https://play.google.com/store/apps/details?id=com.yinyangstudio.kismet" style="color:#00F0FF;">Get on Google Play</a>
  </main>
</body>
</html>
